<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>radio-thomas</title>
</head>
<body>
  <h1>Hello World</h1>
  <p id="backend">Loading backend…</p>
  <script>
    fetch('/api/hello')
      .then((r) => r.json())
      .then((d) => { document.getElementById('backend').textContent = 'Backend says: ' + d.message; })
      .catch(() => { document.getElementById('backend').textContent = 'Backend unreachable'; });
  </script>
</body>
</html>

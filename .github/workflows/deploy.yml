name: Deploy site

# Manual fallback deploy if needed (automatic deploys are handled natively by Vercel on Mrthomaslef/radio-thomas).
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_NEIC7hVwjVttGbPcfootWkNM
  VERCEL_PROJECT_ID: prj_KtBqRP9EoQdcYe1exc2x8PsBi5RH

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      # Deploy the prebuilt output from a folder outside the git checkout, so the
      # deployment carries no commit-author metadata (Vercel Hobby blocks deploys
      # whose commit author is not the account owner).
      - name: Deploy
        run: |
          mkdir -p "$RUNNER_TEMP/deploy"
          cp -R .vercel "$RUNNER_TEMP/deploy/.vercel"
          cd "$RUNNER_TEMP/deploy"
          vercel deploy --prebuilt --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"

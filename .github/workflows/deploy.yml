name: Deploy site

# Every push to master deploys to production. The deploy runs as the project
# owner (via VERCEL_TOKEN), so it works for any collaborator's commits.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_GuVFUHzv9fdBB9H2Y7JCvXaI
  VERCEL_PROJECT_ID: prj_3BnpILiVEsv2zyiJ2FIHFonl5qA2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      # Deploy the prebuilt output from a folder outside the git checkout, so the
      # deployment carries no commit-author metadata (Vercel Hobby blocks deploys
      # whose commit author is not the account owner).
      - name: Deploy
        run: |
          mkdir -p "$RUNNER_TEMP/deploy"
          cp -R .vercel "$RUNNER_TEMP/deploy/.vercel"
          cd "$RUNNER_TEMP/deploy"
          vercel deploy --prebuilt --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
